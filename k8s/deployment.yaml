apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-traffic-deployment
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: train-traffic
  template:
    metadata:
      labels:
        app: train-traffic
    spec:
      containers:
      - name: train-traffic-container
        image: akhileshmunishwar/train-traffic-image:latest 
        ports:
        - containerPort: 8080 
