apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-traffic-deployment
spec:
  replicas: 2 # Runs two copies of your app for backup
  selector:
    matchLabels:
      app: train-traffic
  template:
    metadata:
      labels:
        app: train-traffic
    spec:
      containers:
      - name: train-traffic-container
        image: akhilesh840/train-traffic-image:latest 
        ports:
        - containerPort: 8080 # This matches the exposed port in Dockerfile
