<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Network Topology</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; margin: 0; overflow: hidden; display: flex; }
        .sidebar { width: 380px; background-color: #161b22; border-right: 1px solid #30363d; padding: 20px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar h2 { color: #58a6ff; font-size: 20px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px;}
        .subtitle { font-size: 11px; color: #8b949e; margin-bottom: 20px; letter-spacing: 1px; }
        
        #clock { font-size: 28px; color: #3fb950; margin-bottom: 15px; font-weight: bold; padding: 10px; border: 1px solid #30363d; background: #010409; text-align: center; }
        
        .restart-btn { background: #238636; color: white; border: none; padding: 12px; font-family: monospace; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.2s; border-radius: 4px; }
        .restart-btn:hover { background: #2ea043; box-shadow: 0 0 15px rgba(46, 160, 67, 0.4); }

        .log-panel { background: #010409; border: 1px solid #30363d; padding: 15px; flex-grow: 1; overflow-y: auto; font-size: 12px; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="map" style="height: 100vh; width: 100%;"></div>
    
    <div class="sidebar">
        <h2>SYS_OPT.COREaaa //</h2>
        <div class="subtitle">SECTOR 7: MULTI-AGENT ROUTING - VERSION 2.0</div>
        
        <div id="clock">SYSTEM CLOCK: T=0</div>

        <button class="restart-btn" onclick="location.reload()">[ RESTART SYSTEM UI ]</button>

        <div class="log-panel" id="logs">Waiting for C++ Engine...</div>
    </div>

    <script>
        // 1️⃣ MAP INIT
        const map = L.map('map').setView([19.0760, 72.8777], 6);

        // OPTIONAL: SMOOTHER ZOOM EXPERIENCE
        map.options.zoomAnimation = true;
        map.options.fadeAnimation = true;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2️⃣ STATION COORDS
        const coords = {
            "Mumbai": [19.0760, 72.8777],
            "Lonavala": [18.7546, 73.4062],
            "Pune": [18.5204, 73.8567],
            "Nashik": [19.9975, 73.7898],
            "Kalyan": [19.2437, 73.1355],
            "Surat": [21.1702, 72.8311],
            "Nagpur": [21.1458, 79.0882],
            "Solapur": [17.6599, 75.9064],
            "Bhusawal": [21.0418, 75.7876]
        };

        // 3️⃣ DRAW STATIONS
        for (let station in coords) {
            L.marker(coords[station]).addTo(map).bindPopup(station);
        }

        // 4️⃣ TRAIN MARKERS & ANIMATIONS OBJECTS
        let trainMarkers = {};
        let trainAnimations = {};

        // 5️⃣ FETCH FUNCTION
        async function fetchSystemState() {
            try {
                const response = await fetch('train_state.json?t=' + new Date().getTime());
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();

                // ✅ CLOCK UPDATE
                document.getElementById("clock").innerText =
                    "SYSTEM CLOCK: T=" + data.system_time;

                // ✅ UPDATE LOGS PANEL WITH ACTIVE TRAIN TELEMETRY
                const logsEl = document.getElementById("logs");
                if (logsEl) {
                    let html = `<div style="font-size:11px; color:#58a6ff; font-weight:bold; margin-bottom:10px; border-bottom:1px solid #30363d; padding-bottom:5px;">ACTIVE TRAIN FLEET (${data.active_trains.length})</div>`;
                    data.active_trains.forEach(train => {
                        let statusColor = '#3fb950'; // Resting / normal
                        if (train.status === 'IN_TRANSIT') statusColor = '#58a6ff';
                        else if (train.status === 'DELAYED_WAITING_FOR_TRACK') statusColor = '#f0883e';

                        html += `
                            <div style="background:#0d1117; border:1px solid #30363d; border-radius:4px; padding:8px; margin-bottom:8px;">
                                <div style="display:flex; justify-content:space-between; font-weight:bold; color:#f0f6fc;">
                                    <span>#${train.id} ${train.name}</span>
                                    <span style="color:${statusColor}; font-size:10px;">${train.status}</span>
                                </div>
                                <div style="color:#8b949e; font-size:11px; margin-top:3px;">
                                    📍 <b>${train.current_location}</b> ${train.heading_to ? `➔ <b>${train.heading_to}</b>` : ''}
                                </div>
                                ${train.minutes_remaining !== undefined ? `<div style="color:#79c0ff; font-size:11px; margin-top:2px;">⏱ ETA: ${train.minutes_remaining} mins</div>` : ''}
                            </div>
                        `;
                    });
                    logsEl.innerHTML = html;
                }

                data.active_trains.forEach(train => {
                    // ✅ SAFETY
                    if (!coords[train.current_location]) return;

                    let position;

                    // ✅ FIXED LOGIC
                    if (train.status === 'IN_TRANSIT' && coords[train.heading_to]) {
                        position = coords[train.heading_to];
                    } else {
                        position = coords[train.current_location];
                    }

                    // ✅ CREATE / MOVE MARKER
                    if (!trainMarkers[train.id]) {
                        trainMarkers[train.id] = L.circleMarker(position, {
                            radius: 8,
                            color: '#f85149',
                            fillColor: '#ff7b72',
                            fillOpacity: 0.9,
                            weight: 2
                        }).addTo(map).bindPopup(`<b>#${train.id} ${train.name}</b><br>Status: ${train.status}`);
                    } else {
                        trainMarkers[train.id].setPopupContent(`<b>#${train.id} ${train.name}</b><br>Status: ${train.status}`);
                        smoothMove(train.id, trainMarkers[train.id], position);
                    }
                });

            } catch (error) {
                console.error(error);
                const logsEl = document.getElementById("logs");
                if (logsEl) {
                    if (window.location.protocol === 'file:') {
                        logsEl.innerHTML = `
                            <div style="color:#f85149; font-weight:bold; margin-bottom:6px;">⚠️ CORS Error (file:// URL)</div>
                            <div style="color:#c9d1d9; font-size:11px; line-height:1.4; margin-bottom:10px;">
                                Browsers block JavaScript from reading <code>train_state.json</code> over direct <code>file://</code> paths.
                            </div>
                            <div style="background:#161b22; border:1px solid #30363d; padding:8px; border-radius:4px; font-size:11px; color:#58a6ff;">
                                <b>To fix:</b> Run in terminal:<br>
                                <code style="color:#3fb950;">python -m http.server 8000</code><br><br>
                                Then open:<br>
                                <a href="http://localhost:8000/dashboard.html" target="_blank" style="color:#58a6ff; text-decoration:underline;">http://localhost:8000/dashboard.html</a>
                            </div>
                        `;
                    } else {
                        logsEl.innerHTML = `
                            <div style="color:#f0883e; font-weight:bold;">Waiting for C++ Engine...</div>
                            <div style="color:#8b949e; font-size:11px; margin-top:5px;">
                                Make sure <code>TrainEngine.exe</code> is running inside the <code>build/</code> folder.
                            </div>
                        `;
                    }
                }
            }
        }

        // ✅ 6️⃣ HARDWARE-ACCELERATED SMOOTH MOVE FUNCTION (60FPS)
        function smoothMove(trainId, marker, newPos) {
            // 🛑 STOP previous animation to prevent tug-of-war
            if (trainAnimations[trainId]) {
                cancelAnimationFrame(trainAnimations[trainId]);
            }

            const start = marker.getLatLng();
            const end = L.latLng(newPos);
            
            // ⚡ Set to 950ms so the animation finishes *just* before the next 1000ms fetch
            const duration = 950; 
            let startTime = null;

            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                const timeElapsed = currentTime - startTime;
                
                // Calculate progress from 0.0 to 1.0
                const progress = Math.min(timeElapsed / duration, 1);

                let lat = start.lat + (end.lat - start.lat) * progress;
                let lng = start.lng + (end.lng - start.lng) * progress;

                marker.setLatLng([lat, lng]);

                // Keep animating until we hit 100% (progress == 1)
                if (progress < 1) {
                    trainAnimations[trainId] = requestAnimationFrame(animate);
                }
            }

            // Start the animation loop
            trainAnimations[trainId] = requestAnimationFrame(animate);
        }

        // ✅ 7️⃣ AUTO REFRESH (1000ms TO MATCH C++ ENGINE)
        setInterval(fetchSystemState, 1000);
        fetchSystemState();

    </script>
</body>
</html>
